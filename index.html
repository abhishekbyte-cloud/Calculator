<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <title>Calculator</title>
</head>
<body>
    <div class="main">
        <input type="text">
        <div class="btn-row">
            <button type="button" class="clear-btn btn ">AC</button>
            <button type="button" class="num-btn btn">%</button>
            <button type="button" class="del-btn btn">del</button>
            <button type="button" class="operator-btn num-btn btn">/</button>
        </div>
        <div class="btn-row">
            <button type="button" class="num-btn btn">7</button>
            <button type="button" class="num-btn btn">8</button>
            <button type="button" class="num-btn btn">9</button>
            <button type="button" class="operator-btn num-btn btn">*</button>
        </div>
        <div class="btn-row">
            <button type="button" class="num-btn btn">4</button>
            <button type="button" class="num-btn btn">5</button>
            <button type="button" class="num-btn btn">6</button>
            <button type="button" class="operator-btn num-btn btn">-</button>
        </div>
        <div class="btn-row">
            <button type="button" class="num-btn btn">1</button>
            <button type="button" class="num-btn btn">2</button>
            <button type="button" class="num-btn btn">3</button>
            <button type="button" class="operator-btn num-btn btn">+</button>
        </div>
        <div class="btn-row">
            <button type="button" class="num-btn btn">00</button>
            <button type="button" class="num-btn btn">0</button>
            <button type="button" class="num-btn btn">.</button>
            <button type="button" class="operator-btn equal-btn btn">=</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
